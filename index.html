    <h2>What is it ?</h2>
    <p>A genetic condition caused by extra chromosome, and it affects brain and body development</p>
    <h2>Some Facts</h2>
    <ul>
        <li>It has 3 types</li>
        <li>There is no cure</li>
    </ul>

q    <p>
